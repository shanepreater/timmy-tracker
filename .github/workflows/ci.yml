name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          check_together: "yes"

      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timmy
          POSTGRES_PASSWORD: timmy
          POSTGRES_DB: timmy_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://timmy:timmy@localhost:5432/timmy_tracker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm test

      - run: npm run test:integration

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx playwright install --with-deps chromium

      # CI-safe only: every feature flag stays off (see playwright.config.ts),
      # so this needs no database and no external services. The map/marker
      # E2E test needs a real Maps API key and is local-only — see
      # playwright.map.config.ts and docs/design.md.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
